<text x="138.0" y="100" class="s ink"><tspan font-weight="bold">1857</tspan> Emiliano Valiente Muñasque born, 20 May <tspan class="cap">[S1]</tspan></text>
<line x1="345.4" y1="52" x2="345.4" y2="122" stroke="var(--acc)" stroke-width="1" opacity=".35"/>
<circle cx="345.4" cy="122" r="4.5" fill="var(--acc)"/>
<text x="354.4" y="126" class="s ink"><tspan font-weight="bold">1901</tspan> American military rule reimposed over Cebu, 17 Jul; Opon&#x27;s first municipal election 1905 <tspan class="cap">[S38]</tspan></text>
<line x1="355.2" y1="52" x2="355.2" y2="148" stroke="var(--acc)" stroke-width="1" opacity=".35"/>
<circle cx="355.2" cy="148" r="4.5" fill="var(--acc)"/>
<text x="364.2" y="152" class="s ink"><tspan font-weight="bold">1903</tspan> First US census: Opon 14,851 people <tspan class="cap">[S37]</tspan></text>
<line x1="404.4" y1="52" x2="404.4" y2="174" stroke="var(--acc)" stroke-width="1" opacity=".35"/>
<circle cx="404.4" cy="174" r="4.5" fill="var(--acc)"/>
<text x="413.4" y="178" class="s ink"><tspan font-weight="bold">1913</tspan> Cebuano colonists found Pikit, Cotabato (17 Jun); Glan (Colony No. 9) follows in 1914 <tspan class="cap">[S39]</tspan></text>
<line x1="414.2" y1="52" x2="414.2" y2="200" stroke="var(--acc2)" stroke-width="1" opacity=".35"/>
