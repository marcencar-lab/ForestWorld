<text x="98.7" y="74" class="s ink"><tspan font-weight="bold">1849</tspan> Claveria surname decree (21 Nov 1849); fixed surnames in records from 1850 <tspan class="cap">[S41; S42]</tspan></text>
<line x1="129.0" y1="52" x2="129.0" y2="96" stroke="var(--acc2)" stroke-width="1" opacity=".35"/>
