<text x="497.0" y="256" class="s ink"><tspan font-weight="bold">1930</tspan> Civil Registry Law (Act 3753) creates municipal civil registers <tspan class="cap">[S42]</tspan></text>
<line x1="532.2" y1="52" x2="532.2" y2="278" stroke="var(--acc2)" stroke-width="1" opacity=".35"/>
<circle cx="532.2" cy="278" r="4.5" fill="var(--acc2)"/>
<text x="541.2" y="282" class="s ink"><tspan font-weight="bold">1939</tspan> First NLSA settlers land at Sarangani Bay 27 Feb; Sulpicio Y. Muñasque reaches Dadiangas from Lala 7 Mar <tspan class="cap">[S40; S29]</tspan></text>
<line x1="537.1" y1="52" x2="537.1" y2="304" stroke="var(--acc2)" stroke-width="1" opacity=".35"/>
<circle cx="537.1" cy="304" r="4.5" fill="var(--acc2)"/>
<text x="546.1" y="308" class="s ink"><tspan font-weight="bold">1940</tspan> Emiliano Valiente Muñasque dies, 19 Feb, aged 83 <tspan class="cap">[S1]</tspan></text>
<line x1="542.0" y1="52" x2="542.0" y2="330" stroke="var(--acc)" stroke-width="1" opacity=".35"/>
<circle cx="542.0" cy="330" r="4.5" fill="var(--acc)"/>
<text x="551.0" y="334" class="s ink"><tspan font-weight="bold">1941</tspan> Japanese air raids on Opon oil tanks (Dec, per Wikipedia); WWII <tspan class="cap">[S38]</tspan></text>
<line x1="561.7" y1="52" x2="561.7" y2="356" stroke="var(--acc2)" stroke-width="1" opacity=".35"/>
