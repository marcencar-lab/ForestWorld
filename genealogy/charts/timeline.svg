<text x="423.2" y="204" class="s ink"><tspan font-weight="bold">1915</tspan> Milagros Lago (later Salimbangon) born, 8 Sep 1915/16 <tspan class="cap">[S16; S17]</tspan></text>
<line x1="429.0" y1="52" x2="429.0" y2="226" stroke="var(--acc)" stroke-width="1" opacity=".35"/>
<circle cx="429.0" cy="226" r="4.5" fill="var(--acc)"/>
