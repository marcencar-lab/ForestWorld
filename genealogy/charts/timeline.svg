<text x="921.5" y="620" text-anchor="end" class="s ink"><tspan font-weight="bold">2020</tspan> Spreadsheet last edited (12 Jun); Benhur Salimbangon dies 24 Dec <tspan class="cap">[S4; S12]</tspan></text>
<text x="12" y="682" class="s cap">Only the 1857/1940 dates come from the family file; all other dates come from outside sources listed in the bibliography.</text>
